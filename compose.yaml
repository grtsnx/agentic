name: agentic

x-app: &app
  image: agentic:local
  build: .
  init: true
  restart: unless-stopped
  env_file:
    - ${AGENTIC_ENV_FILE:-.env}
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: '3'

services:
  api:
    <<: *app
    environment:
      NODE_ENV: production
      PORT: '3001'
    ports:
      - '127.0.0.1:${AGENTIC_HTTP_PORT:-3001}:3001'
    stop_grace_period: 30s

  voice:
    <<: *app
    profiles: [voice]
    command: [node, --enable-source-maps, dist/voice.js, start]
    environment:
      NODE_ENV: production
      VOICE_ENABLED: 'true'
    # The SDK exposes worker health internally on 8081 in production mode.
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8081/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    stop_grace_period: 5m
